<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:Anton;src:url(node_modules/@fontsource/anton/files/anton-latin-ext-400-normal.woff2);unicode-range:U+0100-024F}
@font-face{font-family:Corm;font-style:italic;font-weight:500;src:url(node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2)}
@font-face{font-family:Corm;font-style:normal;font-weight:600;src:url(node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2)}
@font-face{font-family:Amiri;font-weight:400;src:url(node_modules/@fontsource/amiri/files/amiri-arabic-400-normal.woff2)}
@font-face{font-family:Amiri;font-weight:700;src:url(node_modules/@fontsource/amiri/files/amiri-arabic-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
:root{--sh:drop-shadow(0 30px 34px rgba(45,35,15,.30)) drop-shadow(0 7px 9px rgba(45,35,15,.20));--bg:#F4F1EA;--ink:#141414;--acc:#0F5B46;--mut:#8a857a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;display:none;transform-origin:50% 45%}
.a{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform}
.anton{font-family:Anton,Amiri,sans-serif;text-transform:uppercase;line-height:.9;color:var(--ink);white-space:nowrap;letter-spacing:.5px}
.corm{font-family:Corm,Amiri,serif;font-style:italic;font-weight:500;color:var(--ink);line-height:1.12;text-align:center}
.inter{font-family:Inter,Amiri,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.32em;color:var(--ink);white-space:nowrap}
.ar{font-family:Amiri,serif;direction:rtl;color:var(--ink);white-space:nowrap}
.acc{color:var(--acc)}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.16em .02em .12em;margin:-.16em 0 -.12em}
.wi{display:inline-block}
.disc{border-radius:50%;background:var(--acc)}
.rule{height:3px;background:var(--ink)}
img{display:block}
img.obj{filter:var(--sh)}
#grain{position:absolute;inset:-200px;background:url(img/grain.png);background-size:600px 600px;pointer-events:none;opacity:.9}
#vig{position:absolute;inset:0;pointer-events:none;background:
 radial-gradient(ellipse 70% 45% at 0% 0%,rgba(40,32,20,.16),transparent 70%),
 radial-gradient(ellipse 70% 45% at 100% 0%,rgba(40,32,20,.12),transparent 70%),
 radial-gradient(ellipse 70% 45% at 0% 100%,rgba(40,32,20,.14),transparent 70%),
 radial-gradient(ellipse 70% 45% at 100% 100%,rgba(40,32,20,.16),transparent 70%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#tag{position:absolute;left:60px;top:150px;font-family:Inter;font-weight:600;font-size:22px;letter-spacing:.3em;color:var(--mut)}
#tag b{color:var(--acc);font-weight:800}
.ph{position:absolute;left:0;top:0;width:1080px;object-fit:cover;filter:saturate(.8) contrast(1.03);-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 100%)}
.chip{font-family:Inter;font-weight:600;text-transform:uppercase;letter-spacing:.28em;background:#141414;color:#F4F1EA;padding:.5em .95em;white-space:nowrap}
.src{font-family:Inter;font-weight:600;letter-spacing:.24em;color:var(--mut);white-space:nowrap;font-size:22px}
.card{background:#FBFAF6;box-shadow:0 40px 80px rgba(40,30,10,.18),0 6px 18px rgba(40,30,10,.10)}
</style></head>
<body><div id="stage">
<div id="scenes"></div>
<div id="vig"></div>
<div id="grain"></div>
<div id="flash"></div>
<div id="tag">LES COMPAGNONS · <b>UHUD</b></div>
</div>
<script>
const W=1080,H=1920,CX=540;const OFF=.3;const N=t=>OFF+t+(t>15.35?.35:0)+(t>34.25?1.0:0)+(t>46.45?.7:0);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>1-Math.pow(1-x,3), eo5=x=>1-Math.pow(1-x,5), lin=x=>x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ex=x=>x>=1?1:1-Math.pow(2,-10*x);
const bk=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const P=(t,t0,d,e=eo)=>e(cl((t-t0)/d));
function tf(el,x,y,o={}){const s=o.s??1,r=o.r??0,ax=o.ax??50,ay=o.ay??50;
 el.style.transformOrigin=`${ax}% ${ay}%`;
 el.style.transform=`translate(${x}px,${y}px) translate(${-ax}%,${-ay}%) rotate(${r}deg) scale(${s})`;
 if(o.o!==undefined)el.style.opacity=o.o; if(o.f!==undefined)el.style.filter=o.f+(el.classList.contains('obj')?' var(--sh)':'');}
const WD=(txt)=>txt.split(' ').map(w=>{let c='';if(w.length>2&&w.startsWith('*')&&w.endsWith('*')){w=w.slice(1,-1);c=' acc'}if(w==='ﷺ')return `<span class="w"><span class="wi" style="font-family:Amiri;font-style:normal">ﷺ</span></span>`;return `<span class="w"><span class="wi${c}">${w}</span></span>`}).join(' ');
function rw(el,t,t0,st=.06,d=.5){el.querySelectorAll('.wi').forEach((s,i)=>{const p=P(t,t0+i*st,d,eo5);if(p>0)mark(s,'word');s.style.transform=`translateY(${(1-p)*115}%)`;});}
function slam(el,x,y,t,t0,o={}){if(t>=t0)mark(el,'slam');const p=P(t,t0,.4,ex);tf(el,x,y,{s:lerp(o.from??1.8,1,p)*(o.s??1),r:o.r??0,o:t<t0?0:cl((t-t0)/.07)});
 const g=t-t0; el.style.textShadow=(g>0&&g<.2)?`${-10*(1-g/.2)}px 0 rgba(15,91,70,.75),${10*(1-g/.2)}px 0 rgba(190,50,40,.45)`:'none';}
function fadeUp(el,x,y,t,t0,d=.5,dist=40,o={}){const p=P(t,t0,d,eo5);if(p>0)mark(el,'fade');tf(el,x,y+(1-p)*dist,{o:p,s:o.s??1});}
function shk(t,t0,d,a){if(t<t0||t>t0+d)return[0,0];const k=1-(t-t0)/d;return[Math.sin(t*97)*a*k,Math.cos(t*71)*a*k];}
function tw(el,txt,t,t0,cps){const n=Math.floor(cl((t-t0)*cps,0,txt.length));const o=twn.get(el)||0;for(let k=o;k<n;k++)EV.push(['type',+CUR.toFixed(3)]);if(n>o)twn.set(el,n);el.textContent=txt.slice(0,n);}
function draw(path,p){path.style.strokeDasharray='1 1';path.style.strokeDashoffset=1-p;}
const S=[];let CUR=0;const EV=[];const seen=new WeakSet();const twn=new Map();
function mark(el,k){if(!seen.has(el)){seen.add(el);EV.push([k,+CUR.toFixed(3)]);}}
function scene(s,e,html,up,o={}){const d=document.createElement('div');d.className='scene';d.innerHTML=html;document.getElementById('scenes').appendChild(d);
 const $=id=>d.querySelector('#'+id);S.push({s:N(s),e:N(e),d,$,up,zoom:o.zoom??.035});}

/* helpers */
const pos=(el,x,y,o={})=>tf(el,x,y,o);
function chipIn(el,x,y,t,t0){const p=P(t,t0,.45,eo5);if(p>0)mark(el,'fade');el.style.clipPath=`inset(0 ${100-p*100}% 0 0)`;tf(el,x,y,{o:t<t0?0:1});}
function srcIn(el,x,y,t,t0){fadeUp(el,x,y,t,t0,.6,16);}
function drop(el,x,y,t,t0,from=-700){const p=P(t,t0,.28,x=>x*x);if(t>=t0+.26)mark(el,'slam');tf(el,x,lerp(from,y,p),{o:t<t0?0:1});}


/* S1 — Badr manqué */
scene(-.3,3.8,`
<img id="sw" class="a obj" src="img/cut_A1.png" style="height:1050px">
<div id="c" class="a chip" style="font-size:24px">BADR · AN 2 DE L'HÉGIRE</div>
<div id="t1" class="a anton" style="font-size:120px">${WD('IL AVAIT MANQUÉ')}</div>
<div id="t2" class="a anton acc" style="font-size:300px">BADR.</div>
<div id="t3" class="a corm" style="font-size:66px">${WD("Et il ne se l'était jamais pardonné.")}</div>`,
(T,$)=>{fadeUp($('sw'),CX,640,T,N(-.2),.9,60);chipIn($('c'),CX,190+60,T,N(.1));
 pos($('t1'),CX,1270);rw($('t1'),T,N(0),.1);
 slam($('t2'),CX,1480,T,N(1.08),{from:1.7});
 pos($('t3'),CX,1680);rw($('t3'),T,N(1.9),.07);},{zoom:.03});

/* S2 — la promesse */
scene(3.8,10.4,`
<img id="sc" class="a obj" src="img/cut_A2.png" style="width:760px">
<div id="t0" class="a inter" style="font-size:28px">IL DIT AU PROPHÈTE ﷺ</div>
<div id="q1" class="a corm" style="font-size:74px;width:900px;white-space:normal"></div>
<div id="t1" class="a anton acc" style="font-size:170px">ALLAH VERRA</div>
<div id="t2" class="a anton" style="font-size:112px">${WD('CE QUE JE FERAI. »')}</div>`,
(T,$)=>{const [sx,sy]=shk(T,N(8.76),.35,10);fadeUp($('sc'),CX,560,T,N(3.85),.8,50);
 fadeUp($('t0'),CX,930,T,N(3.88),.5,20);
 tf($('q1'),CX,1100,{});tw($('q1'),'« Si Allah me fait assister à un combat,',T,N(6.5),26);
 slam($('t1'),CX+sx,1330+sy,T,N(8.72),{from:1.6});
 pos($('t2'),CX,1500);rw($('t2'),T,N(9.3),.09);},{zoom:.03});

/* S3 — Uhud */
scene(10.4,13.0,`
<img id="bg" class="ph" src="img/M18_mount_uhud.png" style="height:1300px;width:2310px;-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 100%)">
<div id="c" class="a chip" style="font-size:26px">UN AN PLUS TARD</div>
<div id="t1" class="a anton acc" style="font-size:330px">UHUD</div>`,
(T,$)=>{const lt=T-N(10.4);tf($('bg'),CX,650,{s:1.0+.05*lt/2.6});
 chipIn($('c'),CX,1290,T,N(10.46));slam($('t1'),CX,1520,T,N(11.8),{from:1.8});},{zoom:.02});

/* S4 — les rangs se brisent */
scene(13.0,15.5,`
<img id="bg" class="ph" src="raw/A3.png" style="height:1080px;width:1080px;top:120px;-webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,#000 55%,transparent 100%)">
<div id="t1" class="a anton" style="font-size:132px">${WD('LES RANGS')}</div>
<div id="t2" class="a anton acc" style="font-size:150px">${WD('SE BRISENT.')}</div>
<div id="t3" class="a corm" style="font-size:80px">${WD('Beaucoup reculent.')}</div>`,
(T,$)=>{const lt=T-N(13);const [sx,sy]=shk(T,N(13.5),.4,14);tf($('bg'),CX+sx,660+sy,{s:1.05-.04*lt/2.5,r:-lt*.8});
 pos($('t1'),CX,1330);rw($('t1'),T,N(13.1),.1);
 pos($('t2'),CX,1480);rw($('t2'),T,N(13.45),.1);
 pos($('t3'),CX,1650);rw($('t3'),T,N(14.2),.08);},{zoom:.03});

/* S5 — lui avance */
scene(15.5,17.3,`
<img id="bg" class="ph" src="raw/A4.png" style="height:1300px;width:1080px;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 20%,#000 60%,transparent 100%)">
<div id="t1" class="a anton" style="font-size:170px">LUI…</div>
<div id="t2" class="a anton acc" style="font-size:280px">AVANCE.</div>`,
(T,$)=>{const lt=T-N(15.5);tf($('bg'),CX,700+lt*-30,{s:1.02+.06*lt/1.8});
 fadeUp($('t1'),CX,1300,T,N(15.56),.4,30);const [sx,sy]=shk(T,N(15.86),.4,16);
 slam($('t2'),CX+sx,1520+sy,T,N(15.84),{from:1.9});},{zoom:.05});

/* S6 — Sa'd ibn Mu'adh */
scene(17.3,20.0,`
<img id="w" class="a obj" src="img/cut_A6.png" style="height:1150px">
<div id="t1" class="a inter" style="font-size:30px">IL CROISE</div>
<div id="t2" class="a anton" style="font-size:118px">${WD("SA'D IBN MU'ÂDH")}</div>
<div id="t3" class="a corm" style="font-size:78px">${WD('et lui crie :')}</div>`,
(T,$)=>{const lt=T-N(17.3);tf($('w'),CX,640-lt*12,{s:lerp(.96,1.03,lt/2.7),o:P(T,N(17.3),.5)});
 fadeUp($('t1'),CX,1330,T,N(17.36),.4,20);
 pos($('t2'),CX,1470);rw($('t2'),T,N(17.8),.12);
 pos($('t3'),CX,1620);rw($('t3'),T,N(18.68),.1);},{zoom:.03});

/* S7 — le Paradis */
scene(20.0,23.9,`
<img id="bg" class="ph" src="img/M26_golden_rays.png" style="height:1300px;width:2310px">
<div id="glow" class="a" style="width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(255,246,222,.9) 0%,rgba(235,217,164,.35) 40%,rgba(235,217,164,0) 70%)"></div>
<div id="t1" class="a anton" style="font-size:150px">« Ô SA'D !</div>
<div id="t2" class="a anton acc" style="font-size:220px">LE PARADIS !</div>
<div id="t3" class="a corm" style="font-size:78px">${WD("Par le Seigneur d'an-Nadr,")}</div>`,
(T,$)=>{const lt=T-N(20);tf($('bg'),CX,650,{s:1.0+.06*lt/3.9});tf($('glow'),CX,560,{s:.9+.1*Math.sin(lt*1.6),o:P(T,N(20.9),.8)});
 slam($('t1'),CX,1300,T,N(20.02),{from:1.5});
 slam($('t2'),CX,1490,T,N(21.1),{from:1.9});
 pos($('t3'),CX,1680);rw($('t3'),T,N(22.06),.1);},{zoom:.03});

/* S8 — le parfum */
scene(23.9,27.3,`
<div id="sun" class="a" style="width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#FFF6DE 0%,#EBD9A4 35%,rgba(235,217,164,0) 70%)"></div>
<img id="fl" class="a obj" src="img/cut_A5.png" style="width:720px">
<div id="t1" class="a anton" style="font-size:128px">${WD('JE SENS')}</div>
<div id="t2" class="a anton acc" style="font-size:170px">${WD('SON PARFUM,')}</div>
<div id="t3" class="a corm" style="font-size:84px">${WD('là, devant Uhud ! »')}</div>`,
(T,$)=>{const lt=T-N(23.9);tf($('sun'),CX,600,{s:.9+.12*Math.sin(lt*1.4),o:P(T,N(23.9),.8)});
 tf($('fl'),CX,640-lt*6,{s:P(T,N(23.92),.6,bk)*lerp(.95,1.03,lt/3.4)});if(T>N(23.92))mark($('fl'),'pop');
 pos($('t1'),CX,1300);rw($('t1'),T,N(24.02),.1);
 pos($('t2'),CX,1450);rw($('t2'),T,N(24.34),.1);
 pos($('t3'),CX,1620);rw($('t3'),T,N(25.3),.09);},{zoom:.03});

/* S9 — 80 blessures */
scene(27.3,31.2,`
<img id="ar" class="a obj" src="img/cut_A7.png" style="width:960px">
<div id="t1" class="a anton" style="font-size:110px">${WD('APRÈS LA BATAILLE,')}</div>
<div id="t0" class="a corm" style="font-size:70px">${WD('on le retrouva avec')}</div>
<div id="t2" class="a anton" style="font-size:120px">PLUS DE</div>
<div id="t3" class="a anton acc" style="font-size:340px">80</div>
<div id="t4" class="a anton" style="font-size:120px">${WD('BLESSURES.')}</div>`,
(T,$)=>{const [sx,sy]=shk(T,N(29.74),.4,14);fadeUp($('ar'),CX+sx,560+sy,T,N(27.3),.7,40);
 pos($('t1'),CX,880);rw($('t1'),T,N(27.36),.1);
 pos($('t0'),CX,1010);rw($('t0'),T,N(28.26),.08);
 slam($('t2'),CX,1160,T,N(29.2),{from:1.4});
 slam($('t3'),CX,1400,T,N(29.72),{from:1.9});
 pos($('t4'),CX,1620);rw($('t4'),T,N(30.12),.1);},{zoom:.04});

/* S10 — sa soeur */
scene(31.2,34.3,`
<img id="bg" class="ph" src="raw/A8.png" style="height:1150px;width:1150px;left:-35px;top:80px;-webkit-mask-image:linear-gradient(to bottom,#000 65%,transparent 100%)">
<div id="t1" class="a corm" style="font-size:84px">${WD('Seule sa sœur')}</div>
<div id="t2" class="a corm" style="font-size:84px">${WD('put le reconnaître…')}</div>
<div id="t3" class="a anton acc" style="font-size:118px">${WD('AU BOUT DE SES DOIGTS.')}</div>`,
(T,$)=>{const lt=T-N(31.2);tf($('bg'),CX,650,{s:1.02+.05*lt/4.1});
 pos($('t1'),CX,1330);rw($('t1'),T,N(31.3),.1);
 pos($('t2'),CX,1450);rw($('t2'),T,N(32.0),.1);
 pos($('t3'),CX,1620);rw($('t3'),T,N(32.82),.13);},{zoom:.02});

/* S11 — le nom */
scene(34.3,37.0,`
<div id="sun" class="a" style="width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,#FFF6DE 0%,#EBD9A4 32%,rgba(235,217,164,0) 70%)"></div>
<div id="t0" class="a inter" style="font-size:32px">IL S'APPELAIT</div>
<div id="t1" class="a anton" style="font-size:330px">ANAS</div>
<div id="t2" class="a anton acc" style="font-size:130px">${WD('IBN AN-NADR')}</div>
<div id="ar" class="a ar" style="font-size:90px;color:var(--mut)">أنس بن النضر</div>`,
(T,$)=>{tf($('sun'),CX,860,{o:P(T,N(34.3),.8),s:.9+.1*P(T,N(34.3),3)});
 fadeUp($('t0'),CX,640,T,N(34.46),.5,20);
 slam($('t1'),CX,860,T,N(34.98),{from:1.8});
 pos($('t2'),CX,1090);rw($('t2'),T,N(35.5),.12);
 fadeUp($('ar'),CX,1260,T,N(36.0),.7,20);},{zoom:.04});

/* S12 — les compagnons pensaient */
scene(37.0,42.1,`
<img id="sc" class="a obj" src="img/cut_A2.png" style="width:560px">
<div id="t1" class="a anton" style="font-size:104px">${WD('SES COMPAGNONS')}</div>
<div id="t2" class="a anton" style="font-size:104px">${WD('PENSAIENT')}</div>
<div id="t3" class="a corm" style="font-size:72px;width:920px;white-space:normal">${WD('que ce *verset* avait été révélé pour lui')}</div>
<div id="t4" class="a corm" style="font-size:72px">${WD('et ceux qui lui ressemblaient :')}</div>`,
(T,$)=>{fadeUp($('sc'),CX,560,T,N(37.0),.7,40);
 pos($('t1'),CX,930);rw($('t1'),T,N(37.12),.1);
 pos($('t2'),CX,1050);rw($('t2'),T,N(37.6),.1);
 pos($('t3'),CX,1240);rw($('t3'),T,N(37.96),.09);
 pos($('t4'),CX,1420);rw($('t4'),T,N(40.2),.09);},{zoom:.03});

/* S13 — le verset */
scene(42.1,46.45,`
<div id="card" class="a card" style="width:940px;height:1060px"></div>
<div id="ar" class="a ar acc" style="font-size:76px;font-weight:700;line-height:1.7;text-align:center;white-space:normal;width:820px">مِنَ الْمُؤْمِنِينَ رِجَالٌ<br>صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ</div>
<div id="r" class="a rule" style="width:220px;background:var(--acc)"></div>
<div id="fr" class="a corm" style="font-size:62px;width:800px;white-space:normal">${WD("« Il est, parmi les croyants, des hommes qui ont été *sincères* dans leur engagement envers Allah. »")}</div>
<div id="s" class="a src">CORAN · AL-AHZÂB 33:23</div>`,
(T,$)=>{tf($('card'),CX,960,{s:P(T,N(42.1),.5,bk),o:P(T,N(42.1),.2)});
 const a=P(T,N(42.2),1.2,eio);tf($('ar'),CX,690,{o:a>0?1:0});$('ar').style.clipPath=`inset(0 0 0 ${100-a*100}%)`;if(a>0)mark($('ar'),'arabic');
 tf($('r'),CX,880,{s:1});$('r').style.transform+=` scaleX(${P(T,N(42.9),.5)})`;
 pos($('fr'),CX,1110);rw($('fr'),T,N(42.3),.14);
 srcIn($('s'),CX,1400,T,N(44.6));},{zoom:.02});

scene(46.45,50.6,`
