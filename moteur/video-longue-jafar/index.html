const P=(t,t0,d,e=eo3)=>e(cl((t-t0)/d));

const EV=[];const seen=new Set();

function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}

    if(s.fx.desat)s.im.style.filter=`grayscale(${s.fx.desat}) sepia(${s.fx.desat*.5}) contrast(1.05)`;

function layerOp(s,T){ if(T<s.t||T>s.end+XF)return 0; const i=s.t<=0?1:cl((T-s.t)/XF); const o=cl((s.end+XF-T)/XF); return Math.min(i, T>s.end? o:1);}

/* caméra : point focal normalisé -> centre */
const K0=Math.max(1920/3344,1080/1882);
function cam(img,fx,fy,s,dx=0,dy=0){const k=K0*s;let X=960-fx*3344*k, Y=540-fy*1882*k;
  X=Math.min(0,Math.max(1920-3344*k,X));Y=Math.min(0,Math.max(1080-1882*k,Y));
  img.style.transform=`translate(${X+dx}px,${Y+dy}px) scale(${k})`;return (px,py)=>[X+px*3344*k,Y+py*1882*k];}

function renderPhoto(s,T){const [a,b,c,d,e,f]=s.cam;const span=s.end+XF-s.t;const p0=cl((T-s.t)/span);const p=.45*p0+.55*eio(p0);
  let dx=0,dy=0;
  if(s.fx.shake){const g=T-s.fx.shake;if(g>0&&g<.6){const A=14*Math.exp(-g*6);dx=A*Math.sin(g*73);dy=A*Math.cos(g*59);mark('shake'+s.t,'shake',s.fx.shake);}}
  const map=cam(s.im,lerp(a,d,p),lerp(b,e,p),lerp(c,f,p),dx,dy);
  if(s.fx.flicker){const [x,y]=map(...s.fx.flicker);const fl=.34+.08*Math.sin(T*9.1)+.05*Math.sin(T*23.7)+.04*Math.sin(T*4.3);
    s.fl.style.background=`radial-gradient(circle at ${x}px ${y}px,rgba(255,196,110,${fl}) 0%,rgba(255,170,80,${fl*.35}) 14%,rgba(255,170,80,0) 38%)`;}
  if(s.fx.bloom){const [bx,by,bt]=s.fx.bloom;const [x,y]=map(bx,by);const g=T-bt;const h=g<0?cl(1+g/.4)*.25:Math.max(.25,Math.exp(-g*1.4))*1.0;
    s.bl.style.background=`radial-gradient(circle at ${x}px ${y}px,rgba(255,238,200,${.55*h}) 0%,rgba(255,220,160,${.25*h}) 25%,rgba(255,220,160,0) 60%)`;}
  if(s.fx.sweep){const sx=lerp(-700,2600,cl((T-s.fx.sweep)/1.8));s.sw.style.background=`linear-gradient(105deg,transparent ${sx-380}px,rgba(255,228,170,.26) ${sx}px,transparent ${sx+380}px)`;}
  s.dk.style.background=`rgba(4,6,4,${s.fx.dark||0})`;}

function pj(lon,lat){return [960+(lon-39.5)*78,540-(lat-19.3)*78];}
function poly(pts){return pts.map((p,i)=>(i?'L':'M')+pj(...p).map(v=>v.toFixed(1)).join(',')).join(' ')+'Z';}
function crPath(pts){const q=pts.map(p=>pj(...p));let d=`M${q[0][0]},${q[0][1]}`;
  for(let i=0;i<q.length-1;i++){const p0=q[Math.max(0,i-1)],p1=q[i],p2=q[i+1],p3=q[Math.min(q.length-1,i+2)];
    d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;}return d;}

  const p=eio(cl((T-r0)/(r1-r0)));

  const pt=s.rt[1].getPointAtLength(s.len*p);s.tv.setAttribute('cx',pt.x);s.tv.setAttribute('cy',pt.y);s.tv.setAttribute('opacity',p>0&&p<1?1:0);

  const q=eio(cl((T-s.t)/(s.end+XF-s.t)));const z=lerp(c[1],c[2],q);const cy=s.fx.route==='abyssinie'?390:450;
  s.g.setAttribute('transform',`translate(${960-c[0][0]*z},${cy-c[0][1]*z}) scale(${z})`);}

function blob(cx,cy,rx,ry,seed,n=28){let d='';for(let i=0;i<=n;i++){const a=i/n*6.283;const r=1+.18*Math.sin(a*3+seed)+.1*Math.sin(a*5+seed*2)+.06*Math.sin(a*9+seed*3);
  const x=cx+Math.cos(a)*rx*r,y=cy+Math.sin(a)*ry*r;d+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1);}return d+'Z';}
const MUS=[[860,560],[960,560],[1060,560],[1160,560],[900,610],[1000,610],[1100,610]];
const QUR=[[620,930],[740,940],[860,950],[980,955],[1100,950],[1220,940],[1340,930],[1460,915],[680,1000],[800,1010],[920,1015],[1040,1015],[1160,1010],[1280,1000],[1400,990]];

  let hill='';for(let k=0;k<4;k++){hill+=`<path d="${blob(640,640,150-k*32,70-k*14,4.1+k)}" fill="${['#16453a','#1d5245','#256050','#2d6c5b'][k]}" stroke="rgba(237,203,133,${.2+k*.08})" stroke-width="2"/>`;}
  let topo='';for(let k=0;k<9;k++){topo+=`<path d="${blob(960,560,1100+k*120,380+k*60,.7+k*.3,40)}" fill="none" stroke="rgba(237,203,133,.05)" stroke-width="2"/>`;}

function renderUhud(s,T){const el=s.el,f=s.fx;
  if(!s.mu){s.mu=[...el.querySelectorAll('.mu')];s.qu=[...el.querySelectorAll('.qu')];s.ar=[...el.querySelectorAll('.ar1')];s.spk=[...el.querySelectorAll('.spk')];
    s.flag=el.querySelector('.flag');s.flagr=el.querySelector('.flagr');s.cloth=el.querySelector('.cloth');s.fglow=el.querySelector('.fglow');s.g=el.querySelector('.ucam');s.dark=el.querySelector('.udark');}
  const t0=s.t;
  // caméra : léger travelling avant vers l'étendard
  const q=eio(cl((T-t0)/(f.end+XF-t0)));const z=lerp(1.0,1.22,q)+(T>f.fall?.05*P(T,f.fall,1.2):0);const fx=1010,fy=lerp(520,500,q);
  s.g.setAttribute('transform',`translate(${960-fx*z},${lerp(540,560,q)-fy*z}) scale(${z})`);
  el.querySelector('.mount').setAttribute('opacity',P(T,t0,.8));el.querySelector('.hill').setAttribute('opacity',P(T,t0+.3,.8));el.querySelector('.topo').setAttribute('opacity',P(T,t0,1.2));
  el.querySelector('.lM').setAttribute('opacity',P(T,t0+.5,.5));el.querySelector('.lH').setAttribute('opacity',P(T,t0+1.0,.5));el.querySelector('.med').setAttribute('opacity',P(T,t0+1.2,.5));
  if(T>t0+.5)mark('uM','tick',t0+.5);if(T>t0+1.0)mark('uH','tick',t0+1.0);
  s.mu.forEach((r,i)=>{const a=P(T,t0+.7+i*.07,.35,bk);r.setAttribute('opacity',cl(a));r.setAttribute('transform',`translate(0,${(1-cl(a))*-20})`);});
  if(T>t0+.7)mark('uMu','units',t0+.7);
  el.querySelector('.lMu').setAttribute('opacity',P(T,t0+1.3,.5)*(1-P(T,f.adv+.6,.4)));
  s.ar.forEach((c,i)=>c.setAttribute('opacity',P(T,t0+1.1+i*.04,.2)));
  el.querySelector('.uchip').style.opacity=P(T,f.date-.1,.5);
  // Quraysh arrive puis avance
  const qa=P(T,f.date+.6,.6), adv=eio(cl((T-f.adv)/2.4));
  if(T>f.date+.6)mark('uQ','units',f.date+.6);if(T>f.adv)mark('uAdv','advance',f.adv);
  s.qu.forEach((r,i)=>{const [x,y]=QUR[i];const ty=-adv*(y>980?300:320);const sx=(x-1040)*-.18*adv;r.setAttribute('opacity',qa);r.setAttribute('transform',`translate(${sx},${ty+(1-qa)*40})`);});
  el.querySelector('.lQ').setAttribute('opacity',qa*(1-adv));
  // étendard
  const fa=P(T,f.flag,.5,bk);s.flag.setAttribute('opacity',cl(fa*3));if(T>f.flag)mark('uF','flag',f.flag);
  const fall=eo3(cl((T-f.fall)/.9)); if(T>f.fall)mark('uFall','fall',f.fall);
  const wave=Math.sin(T*6)*6*(1-fall);
  s.cloth.setAttribute('d',`M4 -148 Q57 ${-150+wave} 110 -140 L104 -96 Q55 ${-94-wave} 4 -100 Z`);
  s.flag.setAttribute('transform',`translate(1010,${545+fall*30}) scale(${lerp(.4,1,cl(fa))})`);
  s.flagr.setAttribute('transform',`rotate(${fall*84})`);
  const hold=T>f.hold&&T<f.fall?.35+.25*Math.sin((T-f.hold)*8):(T>=f.adv&&T<f.fall?.18:0);
  s.fglow.setAttribute('fill',`rgba(255,226,160,${hold})`);s.fglow.setAttribute('cy',-90);
  el.querySelector('.flabel').setAttribute('opacity',P(T,f.flag+.3,.4)*(1-P(T,f.fall,.4)));
  // étincelles du combat
  const on=T>f.adv+1.7;
  s.spk.forEach((c,i)=>{if(!on){c.setAttribute('opacity',0);return;}const life=.55,ph=((T-(f.adv+1.7))*1.6+rnd(i))%1;const x0=780+rnd(i+7)*460,y0=600+rnd(i+13)*30;
    const ang=rnd(i+3)*6.283;c.setAttribute('cx',x0+Math.cos(ang)*ph*50);c.setAttribute('cy',y0+Math.sin(ang)*ph*30-ph*20);
    c.setAttribute('opacity',(1-ph)*(T>f.fall+1.2?cl(1-(T-f.fall-1.2)):1)*.9);});
  if(T>f.adv+1.7)mark('uClash','clash',f.adv+1.7);
  // assombrissement après la chute
  s.dark.style.opacity=.55*P(T,f.fall+.4,1.4);
  el.querySelector('svg').style.filter=`saturate(${1-.7*P(T,f.fall+.3,1.2)})`;}


/* ================= MOTION DESIGN : OBJET DÉTOURÉ SUR CRÈME ================= */
function cutCard(s){const f=s.fx;return `<div class="ov" style="background:#F4F1EA"></div>
  <div class="ov" style="background:radial-gradient(ellipse 75% 70% at 50% 42%,rgba(255,255,255,.55) 0%,rgba(244,241,234,0) 60%,rgba(120,100,70,.18) 100%)"></div>
  <div class="csh" style="position:absolute;left:${960-f.w*.42}px;width:${f.w*.84}px;top:${(f.y||470)+f.h*.5-30}px;height:60px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(60,45,25,.35) 0%,rgba(60,45,25,0) 70%)"></div>
  <img class="cob" src="cut/${f.obj}.png" style="position:absolute;left:${960-f.w/2}px;top:${(f.y||470)-f.h/2}px;width:${f.w}px;height:${f.h}px;filter:drop-shadow(0 26px 30px rgba(40,30,15,.35));transform-origin:50% 60%">`;}
function renderCut(s,T){const f=s.fx,e=s.el;if(!s.ob){s.ob=e.querySelector('.cob');s.cs=e.querySelector('.csh');}
  const h=T-s.t;let x=0,y=0,r=0,sc=1,sh=1;
  const fl=Math.sin(T*1.3)*6, zoom=1+.04*cl(h/6);
  if(f.anim==='drop'){const p=cl((h-.15)/.6);y=p<1?lerp(-900,0,bk(p)):fl;sh=cl(p);if(h>.6)mark('cut'+s.t,'cuthit',s.t+.6);}
  else if(f.anim==='slide'){const p=eo5(cl((h-.1)/.8));x=lerp(1500,0,p)+(p>=1?fl*.5:0);sh=p;if(h>.1)mark('cut'+s.t,'cutin',s.t+.1);}
  else if(f.anim==='rise'){const p=eo5(cl((h-.1)/.9));y=lerp(700,0,p)+(p>=1?fl:0);sh=p;if(h>.1)mark('cut'+s.t,'cutin',s.t+.1);}
  else if(f.anim==='staff'){const g=T-f.hit;const p0=eo5(cl((h-.05)/.8));const p=cl((T-(f.hit-.35))/.35);y=lerp(-800,-170,p0)+fl*(1-p)+lerp(0,170,p*p);r=lerp(-30,-14,p0)+lerp(0,14,p*p);sh=.4*p0+.6*p;
    if(g>0){const A=12*Math.exp(-g*7);y+=A*Math.sin(g*60);r+=A*.25*Math.sin(g*50);mark('cut'+s.t,'cuthit',f.hit);}}
  else if(f.anim==='exit'){const p=eio(cl((T-f.hit)/.9));x=lerp(0,-1900,p)+(p<=0?fl*.5:0);r=lerp(0,-6,p);sh=1-p;if(T>f.hit)mark('cut'+s.t,'cutout',f.hit);}
  s.ob.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${zoom})`;
  s.cs.style.opacity=sh;s.cs.style.transform=`translateX(${x}px) scaleX(${.6+.4*sh})`;}

/* ================= RÉCITATION ================= */
function recCard(s){const R=D.rec;let v='';
  R.verses.forEach((x,i)=>{v+=`<div class="rv" data-i="${i}" style="position:absolute;left:560px;width:800px;top:250px;text-align:center;opacity:0">
     <div class="ar" style="font-size:${x.ar.length>45?64:84}px;line-height:1.55;color:#F3E2B6;white-space:normal;text-shadow:0 6px 26px rgba(0,0,0,.55)">${x.ar}</div>
     <div style="margin:26px auto 0;width:180px;height:2px;background:rgba(237,203,133,.7)"></div>
     <div class="corm" style="margin-top:22px;font-size:${x.fr.length>90?38:44}px;line-height:1.3;color:var(--cream);text-shadow:0 4px 18px rgba(0,0,0,.6)">${x.fr}</div>
     <div style="margin-top:20px;font-family:Inter;font-weight:800;font-size:19px;letter-spacing:.35em;color:var(--gold)">MARYAM · 19:${x.n}</div></div>`;});
  return `<img class="ph" src="hd/J18.jpg"><div class="ov" style="background:radial-gradient(ellipse 34% 62% at 50% 46%,rgba(3,22,16,.55) 0%,rgba(3,22,16,.15) 70%,rgba(0,0,0,0) 100%)"></div>
   <div class="ov" style="background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.45))"></div>
   <div class="chip rchip" style="left:50%;top:150px;transform:translateX(-50%);opacity:0">SOURATE MARYAM · RÉCITATION</div>${v}`;}
function renderRec(s,T){const R=D.rec,e=s.el;if(!s.im){s.im=e.querySelector('.ph');s.vs=[...e.querySelectorAll('.rv')];s.ch=e.querySelector('.rchip');}
  const q=cl((T-s.t)/(s.end+XF-s.t));cam(s.im,.5,.47,lerp(1.0,1.07,q));
  s.ch.style.opacity=P(T,s.t+.3,.6);
  s.vs.forEach((d,i)=>{const x=R.verses[i];const nx=R.verses[i+1];const t1=nx?nx.s-.15:R.t1-.3;
    const a=P(T,x.s-.25,.7,eo3),o=cl((t1+.35-T)/.35);d.style.opacity=Math.min(a,o);d.style.transform=`translateY(${(1-a)*18}px)`;});}

/* ================= FIN : SOURCES & ABONNE-TOI ================= */
function endCard(){return `<img class="ph" src="hd/J17.jpg" style="filter:blur(10px) brightness(.45);transform:scale(.62)">
 <div class="ov" style="background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(15,91,70,.8) 0%,rgba(5,30,22,.95) 100%)"></div>
 <div class="e1 ar" style="position:absolute;left:0;right:0;top:170px;text-align:center;font-size:92px;color:var(--gold);text-shadow:0 6px 30px rgba(0,0,0,.6)" >جَعْفَرُ بْنُ أَبِي طَالِبٍ رَضِيَ اللهُ عَنْهُ</div>
 <div class="e2" style="position:absolute;left:810px;width:300px;top:370px;height:2px;background:rgba(237,203,133,.7)"></div>
 <div class="e3" style="position:absolute;left:0;right:0;top:420px;text-align:center;font-family:Inter;font-weight:800;font-size:22px;letter-spacing:.5em;color:var(--gold)">SOURCES</div>
 <div class="e4 corm" style="position:absolute;left:0;right:0;top:480px;text-align:center;font-size:50px;line-height:1.35;color:var(--cream)">Musnad Ahmad · 1740 <span style="color:var(--gold)">(hasan)</span><br>Ibn Hishâm, <span style="color:var(--gold)">as-Sîra an-Nabawiyya</span><br>Coran · Sourate Maryam 19:1-4 · <span style="color:var(--gold)">récitation Mishary Alafasy</span></div>
 <img class="e5" src="img/logo.png" style="position:absolute;left:915px;top:800px;width:90px">`;}
function subCard(){return `<div class="sD" style="position:absolute;left:760px;top:170px;width:400px;height:400px;border-radius:50%;background:var(--acc)"></div>
 <img class="sL" src="img/logo.png" style="position:absolute;left:825px;top:235px;width:270px">
 <div class="sT anton" style="position:absolute;left:0;right:0;top:610px;text-align:center;font-size:150px;color:var(--ink);line-height:1">ABONNE-TOI</div>
 <div class="sS" style="position:absolute;left:0;right:0;top:785px;text-align:center;font-family:Inter;font-weight:600;font-size:28px;letter-spacing:.3em;color:var(--ink)">UNE HISTOIRE CHAQUE VENDREDI</div>
 <div class="sB" style="position:absolute;left:810px;top:860px;width:300px;text-align:center;font-family:Inter;font-weight:800;font-size:28px;color:#F4F1EA;background:var(--acc);padding:22px 0;border-radius:80px;letter-spacing:.2em">S'ABONNER</div>`;}
function renderEnd(s,T){const e=s.el,q=c=>e.querySelector(c);const h=T-s.t;
  const w=P(h,.2,1.2,eio);q('.e1').style.clipPath=`inset(0 0 0 ${100-w*100}%)`;if(h>.2)mark('e1','arabic',s.t+.2);
  q('.e2').style.transform=`scaleX(${P(h,1.1,.6)})`;q('.e3').style.opacity=P(h,1.3,.5);
  const f=P(h,1.5,.7,eo5);q('.e4').style.opacity=f;q('.e4').style.transform=`translateY(${(1-f)*24}px)`;q('.e5').style.opacity=P(h,2.2,.6);
  q('.ph').style.transform=`scale(${.62+.04*h/5})`;}
function renderSub(s,T){const e=s.el,q=c=>e.querySelector(c);const h=T-s.t;
  q('.sD').style.transform=`scale(${P(h,.05,.6,bk)})`;q('.sL').style.transform=`scale(${P(h,.2,.6,bk)})`;
  const tp=P(h,.35,.4,ex);if(h>.35)mark('sT','slamH',s.t+.35);q('.sT').style.transform=`scale(${lerp(1.5,1,tp)})`;q('.sT').style.opacity=h>.35?1:0;
  q('.sS').style.opacity=P(h,.7,.5);const b=P(h,1.0,.5,bk);if(h>1.0)mark('sB','pop',s.t+1.0);
  q('.sB').style.transform=`scale(${b*(1+(h>1.9&&h<2.1?.06:0))})`;}

/* ================= SOUS-TITRES ================= */
const CAPS=$('caps');
D.chunks.forEach((c,ci)=>{const d=document.createElement('div');const q=c.quote&&!c.band;
  d.className='blk '+(q?'corm sh':'anton sh');d.style.bottom=(c.band?118:112)+'px';c.el=d;c.words=[];
  c.lines.forEach((L,li)=>{const ln=document.createElement('div');ln.className='ln'+(c.band?' band':'');
    ln.style.fontSize=(c.band?(c.lines.length>1?96:112):(q?74:76))+'px';
    L.forEach(([tx,s,e,k],wi)=>{const sp=document.createElement('span');sp.className='w'+(k?' k':'');sp.textContent=tx;ln.appendChild(sp);if(wi<L.length-1)ln.appendChild(document.createTextNode(' '));
      c.words.push({el:sp,t0:s,k,key:`${ci}-${li}-${wi}`});});
    d.appendChild(ln);});
  CAPS.appendChild(d);});
function fitCaps(){D.chunks.forEach(c=>c.el.querySelectorAll('.ln').forEach(l=>{c.el.style.display='flex';let fs=parseFloat(l.style.fontSize);while(l.scrollWidth>1660&&fs>34){fs-=2;l.style.fontSize=fs+'px';}c.el.style.display='none';}));}
function capsHidden(T){const t=D.title;if(D.rec&&T>D.rec.t0-.1&&T<D.rec.t1)return true;if(T>t.t0-.05&&T<t.t1+.2)return true;if(D.chap.some(c=>T>=c[0]+.15&&T<c[1]+.1))return true;return false;}
function renderCaps(T){const hid=capsHidden(T);let top=null;SH.forEach(s=>{if(T>=s.t&&T<s.end+.2)top=s;});const ink=top&&top.img==='CUT'&&T>top.t+XF*.6;
  D.chunks.forEach((c,ci)=>{const vis=!hid&&T>=c.t0-.1&&T<c.hide+.15;c.el.style.display=vis?'flex':'none';if(!vis)return;c.el.classList.toggle('ink',!!ink);
    const out=cl((T-c.hide)/.15);c.el.style.opacity=1-out;c.el.style.transform=`translateY(${-out*14}px)`;
    if(c.band){mark('band'+ci,'band',c.t0);c.el.querySelectorAll('.ln').forEach((l,li)=>{const p=eo5(cl((T-(c.t0-.16+li*.18))/.32));l.style.clipPath=`inset(-30% ${100-p*100}% -30% 0)`;});}
    c.words.forEach(w=>{const slam=c.band&&w.k;const p=cl((T-(w.t0-.06))/(slam?.45:.3));const e=eo5(p);
      if(p>0)mark(w.key,slam?'slam':(w.k?'key':'word'),w.t0);
      if(slam){w.el.style.transform=`scale(${lerp(1.9,1,ex(p))})`;w.el.style.opacity=cl(p/.1);const g=T-w.t0;w.el.style.filter=g>0&&g<.3?`drop-shadow(0 0 ${34*(1-g/.3)}px rgba(237,203,133,.95))`:'none';}
      else{w.el.style.opacity=e;w.el.style.transform=`translateY(${(1-e)*.36}em) scale(${w.k?lerp(1.14,1,e):1})`;w.el.style.filter=p<1?`blur(${(1-e)*9}px)`:'none';}});});}

/* ================= TITRE & CHAPITRES ================= */
function renderTitle(T){const t=D.title,el=$('title');const on=T>t.t0-.05&&T<t.t1+.4;el.style.display=on?'block':'none';if(!on)return;
  el.style.opacity=cl((t.t1+.4-T)/.4);
  const h=P(T,t.th-.05,.5,eo5);$('tH').style.opacity=h;$('tH').style.letterSpacing=lerp(1.1,.55,h)+'em';if(T>t.th)mark('tH','titleH',t.th);
  const n=cl((T-(t.tn-.08))/.5);$('tN').style.opacity=n>0?1:0;$('tN').style.transform=`scale(${lerp(1.7,1,ex(n))})`;
  const g=T-t.tn;$('tN').style.filter=g>0&&g<.5?`drop-shadow(0 0 ${50*(1-g/.5)}px rgba(237,203,133,.95))`:'none';if(T>t.tn-.08)mark('tN','titleN',t.tn);
  $('tRule').style.transform=`scaleX(${P(T,t.tn+.35,.6,eio)})`;
  const a=P(T,t.tn+.55,1.0,eio);$('tAr').style.clipPath=`inset(0 0 0 ${100-a*100}%)`;$('tAr').style.opacity=a>0?1:0;}
function renderChap(T){const C=D.chap.find(c=>T>=c[0]-.02&&T<c[1]+.35);const el=$('chap');el.style.display=C?'block':'none';if(!C)return;
  const [a,b,num,tt]=C;mark('chap'+num,'chap',a);
  const i=eo3(cl((T-a)/.4)),o=cl((b+.35-T)/.35);el.style.opacity=Math.min(i,o);
  $('chapNum').textContent='CHAPITRE '+num;$('chapT').textContent=tt;
  const w=eo5(cl((T-a-.12)/.55));$('chapT').style.clipPath=`inset(-20% ${50-w*50}% -20% ${50-w*50}%)`;$('chapT').style.transform=`scale(${lerp(1.08,1,w)})`;
  $('chapT').style.letterSpacing=lerp(14,3,w)+'px';
  $('chapNum').style.opacity=P(T,a+.05,.4);$('chapRule').style.transform=`scaleX(${P(T,a+.3,.6,eio)})`;}

/* ================= POUSSIÈRE ================= */
const cv=$('dust'),cx=cv.getContext('2d');
const MOTES=[...Array(120)].map((_,i)=>({x:rnd(i)*1920,y:rnd(i+500)*1080,r:1+rnd(i+900)*3,sp:5+rnd(i+77)*14,ph:rnd(i+33)*6.28,big:rnd(i+5)>.93}));
function renderDust(T,op){cx.clearRect(0,0,1920,1080);if(op<=0.01)return;
  MOTES.forEach(m=>{const x=(m.x+T*m.sp*1.1+Math.sin(T*.5+m.ph)*26)%1960-20,y=(m.y-T*m.sp*.5+1100)%1100-10;
    const beam=Math.exp(-Math.pow(((x-900)+(y-500)*0.9)/420,2));const al=op*(0.10+0.5*beam)*(0.6+0.4*Math.sin(T*1.7+m.ph));const r=m.big?m.r*3.2:m.r;
    const g=cx.createRadialGradient(x,y,0,x,y,r*2.2);g.addColorStop(0,`rgba(255,236,190,${al})`);g.addColorStop(1,'rgba(255,236,190,0)');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r*2.2,0,6.283);cx.fill();});}

/* ================= RENDU ================= */
function render(T){let dust=0;
  SH.forEach((s,i)=>{const op=layerOp(s,T);s.el.style.display=op>0?'block':'none';s.el.style.opacity=op;s.el.style.zIndex=i;if(op<=0)return;
    if(i>0&&T>=s.t)mark('shot'+i,s.img.startsWith('MAP')?'mapin':(s.img==='END'||s.img==='SUB'?'endin':'shot'),s.t);
    if(/^J\d/.test(s.img)){renderPhoto(s,T);dust=Math.max(dust,(s.fx.dust||0)*op);}
    else if(s.img==='MAP_RS')renderMapRS(s,T);else if(s.img==='MAP_UHUD')renderUhud(s,T);else if(s.img==='REC')renderRec(s,T);else if(s.img==='CUT')renderCut(s,T);else if(s.img==='END')renderEnd(s,T);else if(s.img==='SUB')renderSub(s,T);});
  renderDust(T,dust*(capsHidden(T)?.6:1));renderTitle(T);renderCaps(T);renderChap(T);
  const endMode=T>D.VEND+.5;$('tag').style.opacity=endMode?0:1;$('logo').style.opacity=endMode?0:.9;
  const f=Math.floor(T*30);$('grain').style.transform=`translate(${(f*137)%200-100}px,${(f*271)%200-100}px)`;
  $('fade').style.opacity=Math.max(1-cl(T/.4),cl((T-(DUR-.5))/.5));}
window.render=render;window.EV=EV;window.DUR=DUR;
window.READY=false;document.fonts.ready.then(()=>{initLayers();fitCaps();render(0);window.READY=true;});
</script></body></html>
