<style>

:root{--cream:#FBF6EA;--gold:#EDCB85;--acc:#0F5B46;--ink:#141414}
*{margin:0;padding:0;box-sizing:border-box}

.L{position:absolute;inset:0;overflow:hidden;display:none}

.ov{position:absolute;inset:0;pointer-events:none}
.low{background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 16%,rgba(0,0,0,0) 45%,rgba(6,5,3,.72) 72%,rgba(6,5,3,.88) 100%)}

</style></head>
<body><div id="stage">
<div id="layers" style="position:absolute;inset:0;z-index:0;isolation:isolate"></div>
<canvas id="dust" width="1080" height="1920"></canvas>
<div id="title">
 <div id="tH" style="position:absolute;left:0;right:0;top:640px;text-align:center;font-family:Inter;font-weight:800;font-size:32px;letter-spacing:.55em;color:var(--gold)">L'HISTOIRE DE</div>
 <div id="tN" class="anton" style="position:absolute;left:0;right:0;top:710px;text-align:center;font-size:200px;line-height:1;text-shadow:0 12px 50px rgba(0,0,0,.6)">MUS'AB<br>IBN UMAYR</div>
 <div id="tRule" style="position:absolute;left:290px;width:500px;top:1130px;height:3px;background:var(--gold)"></div>
 <div id="tAr" class="ar" style="position:absolute;left:0;right:0;top:1160px;text-align:center;font-size:92px;color:var(--gold);text-shadow:0 6px 30px rgba(0,0,0,.6)">مُصْعَبُ بْنُ عُمَيْرٍ</div>
</div>
<div id="caps"></div>
<div id="chap"><div id="chapBg"></div><div id="chapTint"></div><div id="chapNum"></div><div id="chapT"></div><div id="chapRule"></div></div>
<div id="vig"></div>
<div id="grain"></div>
<div id="tag">COMPAGNONS · <b>03</b></div>
<img id="logo" src="img/logo.png">
<div id="fade"></div>
</div>
<script>
const D=__DATA__;
const DUR=D.DUR;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo5=x=>1-Math.pow(1-x,5), eo3=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ex=x=>x>=1?1:1-Math.pow(2,-10*x);
const bk=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const P=(t,t0,d,e=eo3)=>e(cl((t-t0)/d));
const $=id=>document.getElementById(id);
const EV=[];const seen=new Set();
function mark(key,k,t){if(!seen.has(key)){seen.add(key);EV.push([k,+t.toFixed(3),key]);}}
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const XF=0.55; // durée des fondus enchaînés

/* ================= COUCHES ================= */
const SH=D.shots; const LY=$('layers');
function initLayers(){SH.forEach((s,i)=>{s.end=i<SH.length-1?SH[i+1].t:DUR;
  const d=document.createElement('div');d.className='L';s.el=d;
  if(/^M\d/.test(s.img)){
    d.innerHTML=`<img class="ph" src="hd/${s.img}.jpg"><div class="ov fl"></div><div class="ov bl"></div><div class="ov sw"></div><div class="ov dk"></div><div class="ov low"></div>`;
    s.im=d.querySelector('.ph');s.fl=d.querySelector('.fl');s.bl=d.querySelector('.bl');s.sw=d.querySelector('.sw');s.dk=d.querySelector('.dk');
    if(s.fx.desat)s.im.style.filter=`grayscale(${s.fx.desat}) sepia(${s.fx.desat*.5}) contrast(1.05)`;
    else s.im.style.filter='contrast(1.06) saturate(1.04)';
  } else if(s.img==='MAP_RS'){d.innerHTML=mapRS(s);}
  else if(s.img==='MAP_UHUD'){d.innerHTML=mapUhud(s);}
  else if(s.img==='END'){d.innerHTML=endCard();}
  else if(s.img==='SUB'){d.style.background='#F4F1EA';d.innerHTML=subCard();}
  LY.appendChild(d);});}

function layerOp(s,T){ if(T<s.t||T>s.end+XF)return 0; const i=s.t<=0?1:cl((T-s.t)/XF); const o=cl((s.end+XF-T)/XF); return Math.min(i, T>s.end? o:1);}

/* caméra : point focal normalisé -> centre */
const K0=Math.max(1080/3344,1920/1882);
function cam(img,fx,fy,s,dx=0,dy=0){const k=K0*s;let X=540-fx*3344*k, Y=960-fy*1882*k;
  X=Math.min(0,Math.max(1080-3344*k,X));Y=Math.min(0,Math.max(1920-1882*k,Y));
  img.style.transform=`translate(${X+dx}px,${Y+dy}px) scale(${k})`;return (px,py)=>[X+px*3344*k,Y+py*1882*k];}

function renderPhoto(s,T){const [a,b,c,d,e,f]=s.cam;const span=s.end+XF-s.t;const p0=cl((T-s.t)/span);const p=.45*p0+.55*eio(p0);
  let dx=0,dy=0;
  if(s.fx.shake){const g=T-s.fx.shake;if(g>0&&g<.6){const A=14*Math.exp(-g*6);dx=A*Math.sin(g*73);dy=A*Math.cos(g*59);mark('shake'+s.t,'shake',s.fx.shake);}}
  const map=cam(s.im,lerp(a,d,p),lerp(b,e,p),lerp(c,f,p),dx,dy);
  if(s.fx.flicker){const [x,y]=map(...s.fx.flicker);const fl=.34+.08*Math.sin(T*9.1)+.05*Math.sin(T*23.7)+.04*Math.sin(T*4.3);
    s.fl.style.background=`radial-gradient(circle at ${x}px ${y}px,rgba(255,196,110,${fl}) 0%,rgba(255,170,80,${fl*.35}) 14%,rgba(255,170,80,0) 38%)`;}
  if(s.fx.bloom){const [bx,by,bt]=s.fx.bloom;const [x,y]=map(bx,by);const g=T-bt;const h=g<0?cl(1+g/.4)*.25:Math.max(.25,Math.exp(-g*1.4))*1.0;
    s.bl.style.background=`radial-gradient(circle at ${x}px ${y}px,rgba(255,238,200,${.55*h}) 0%,rgba(255,220,160,${.25*h}) 25%,rgba(255,220,160,0) 60%)`;}
  if(s.fx.sweep){const sx=lerp(-700,2600,cl((T-s.fx.sweep)/1.8));s.sw.style.background=`linear-gradient(105deg,transparent ${sx-380}px,rgba(255,228,170,.26) ${sx}px,transparent ${sx+380}px)`;}
  s.dk.style.background=`rgba(4,6,4,${s.fx.dark||0})`;}

/* ================= CARTE : MER ROUGE ================= */
function pj(lon,lat){return [960+(lon-39.5)*78,540-(lat-19.3)*78];}
function poly(pts){return pts.map((p,i)=>(i?'L':'M')+pj(...p).map(v=>v.toFixed(1)).join(',')).join(' ')+'Z';}
function crPath(pts){const q=pts.map(p=>pj(...p));let d=`M${q[0][0]},${q[0][1]}`;
  for(let i=0;i<q.length-1;i++){const p0=q[Math.max(0,i-1)],p1=q[i],p2=q[i+1],p3=q[Math.min(q.length-1,i+2)];
    d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;}return d;}
const ARAB=[[34.9,29.5],[35.7,27.3],[36.5,26.2],[37.3,25.0],[38.1,24.1],[39.0,22.8],[39.17,21.5],[40.3,20.1],[41.1,19.1],[42.55,16.9],[42.95,14.8],[43.25,13.3],[43.45,12.65],[45.0,12.8],[48.5,14.0],[52,15.5],[60,16],[60,32],[34.9,32]];
const AFR=[[32.5,29.9],[33.8,27.2],[34.3,26.1],[34.9,25.1],[35.5,23.9],[36.6,22.2],[37.2,19.6],[37.3,19.1],[38.5,17.9],[39.45,15.6],[40.8,14.6],[41.7,13.8],[42.7,13.0],[43.1,11.6],[44.5,10.4],[47,11.1],[49.5,11.3],[51.2,11.8],[51.3,0],[20,0],[20,32],[32.5,32]];
const MECCA=[39.83,21.42],MEDINA=[39.61,24.47],AXUM=[38.72,14.13];
const ROUTES={abyssinie:[MECCA,[39.25,20.95],[38.85,18.6],[39.3,16.2],[39.65,15.3],AXUM],yathrib:[MECCA,[39.95,22.3],[39.45,23.4],MEDINA]};
function pin(id,c,label,sub,side){const [x,y]=pj(...c);const lx=side==='l'?x-30:x+30, an=side==='l'?'end':'start';
  return `<g id="${id}" opacity="0"><circle cx="${x}" cy="${y}" r="26" fill="none" stroke="#EDCB85" stroke-width="2" class="ring"/><circle cx="${x}" cy="${y}" r="11" fill="#0F5B46" stroke="#FBF6EA" stroke-width="3"/>
   <text x="${lx}" y="${y+10}" text-anchor="${an}" font-family="Anton" style="font-family:Anton;letter-spacing:2px" font-size="46" fill="#141414">${label}</text>
   ${sub?`<text x="${lx}" y="${y+44}" text-anchor="${an}" font-size="18" fill="#3b3121">${sub}</text>`:''}</g>`;}
function mapRS(s){const grat=[];for(let lo=28;lo<=52;lo+=2){const [x]=pj(lo,0);grat.push(`<line x1="${x}" y1="-400" x2="${x}" y2="1500" />`);}for(let la=8;la<=32;la+=2){const [,y]=pj(0,la);grat.push(`<line x1="-400" y1="${y}" x2="2400" y2="${y}"/>`);}
  const [sx,sy]=pj(38.4,20.2);
  return `<div class="ov" style="background:radial-gradient(ellipse at 50% 45%,#0e4638 0%,#082c23 60%,#041a14 100%)"></div>
  <svg width="1920" height="1080" class="mapsvg" style="position:absolute;left:0;top:0;overflow:visible"><g class="mcam">
   <defs><filter id="lsh${s.t|0}"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
   <pattern id="hat${s.t|0}" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="14" stroke="rgba(120,95,55,.12)" stroke-width="3"/></pattern></defs>
   <g stroke="rgba(237,203,133,.08)" stroke-width="1.5">${grat.join('')}</g>
   <g class="sea-lines" fill="none" stroke="rgba(237,203,133,.10)" stroke-width="2">${[0,1,2,3].map(i=>`<path d="${crPath([[33.6+i*.3,28-i*.2],[36.5+i*.3,23],[39.6+i*.3,17.2],[42.3+i*.2,13.6]])}"/>`).join('')}</g>
   <path d="${poly(AFR)}" fill="#CDB68A" filter="url(#lsh${s.t|0})"/><path d="${poly(AFR)}" fill="url(#hat${s.t|0})"/>
   <path d="${poly(ARAB)}" fill="#D8C49A" filter="url(#lsh${s.t|0})"/><path d="${poly(ARAB)}" fill="url(#hat${s.t|0})"/>
   <path d="${poly(ARAB)}" fill="none" stroke="#EDCB85" stroke-width="2.5"/><path d="${poly(AFR)}" fill="none" stroke="#EDCB85" stroke-width="2.5"/>
   <text x="${pj(44.5,19.5)[0]}" y="${pj(44.5,19.5)[1]}" font-size="40" fill="rgba(60,48,30,.45)" style="letter-spacing:.6em" text-anchor="middle">ARABIE</text>
   <text x="${pj(33.2,18)[0]}" y="${pj(33.2,18)[1]}" font-size="40" fill="rgba(60,48,30,.45)" style="letter-spacing:.6em" text-anchor="middle">AFRIQUE</text>
   <text x="${sx}" y="${sy}" transform="rotate(57 ${sx} ${sy})" text-anchor="middle" style="font-family:Corm;font-style:italic;font-weight:500;letter-spacing:.25em" font-size="44" fill="rgba(237,203,133,.75)">Mer Rouge</text>
   <path class="rt" d="${crPath(ROUTES[s.fx.route])}" fill="none" stroke="#141414" stroke-width="13" stroke-linecap="round" opacity=".35"/>
   <path class="rt" d="${crPath(ROUTES[s.fx.route])}" fill="none" stroke="#0F5B46" stroke-width="7" stroke-linecap="round"/>
   <path class="rt" d="${crPath(ROUTES[s.fx.route])}" fill="none" stroke="#EDCB85" stroke-width="2.5" stroke-linecap="round"/>
   ${pin('pA',MECCA,'LA MECQUE','',s.fx.route==='yathrib'?'r':'r')}
   ${s.fx.route==='abyssinie'?pin('pB',AXUM,'ABYSSINIE','ROYAUME DU NÉGUS','r'):pin('pB',MEDINA,'YATHRIB','LA FUTURE MÉDINE','r')}
   <circle class="trav" r="13" fill="#FBF6EA" stroke="#EDCB85" stroke-width="4" opacity="0"/>
  </g></svg>
  <div class="ov" style="background:linear-gradient(to bottom,rgba(0,0,0,0) 65%,rgba(20,14,6,.6) 100%)"></div><div class="chip mchip" style="left:70px;top:140px;opacity:0;background:rgba(20,20,20,.85)">${s.fx.route==='abyssinie'?'615 · PREMIÈRE HÉGIRE':'621 · APRÈS LE SERMENT D\'AL-\'AQABA'}</div>`;}
function renderMapRS(s,T){const el=s.el;const r0=s.fx.r0,r1=s.fx.r1;
  if(!s.rt){s.rt=[...el.querySelectorAll('.rt')];s.len=s.rt[1].getTotalLength();s.rt.forEach(r=>{r.style.strokeDasharray=`${s.len} ${s.len}`;});s.tv=el.querySelector('.trav');s.g=el.querySelector('.mcam');s.pA=el.querySelector('#pA');s.pB=el.querySelector('#pB');s.chip=el.querySelector('.mchip');}
  const p=eio(cl((T-r0)/(r1-r0)));
  s.rt.forEach(r=>r.style.strokeDashoffset=s.len*(1-p));
  // masque pour les pointillés : on les cache au-delà du point courant
  const pt=s.rt[1].getPointAtLength(s.len*p);s.tv.setAttribute('cx',pt.x);s.tv.setAttribute('cy',pt.y);s.tv.setAttribute('opacity',p>0&&p<1?1:0);
  const a=P(T,s.t+.25,.5,bk),b=P(T,r1-.3,.5,bk);s.pA.setAttribute('opacity',cl(a));s.pB.setAttribute('opacity',cl(b));
  if(T>s.t+.25)mark('pinA'+s.t,'pin',s.t+.25); if(T>r1-.3)mark('pinB'+s.t,'pin2',r1-.3); if(T>r0)mark('route'+s.t,'route',r0);
  [s.pA,s.pB].forEach((g,i)=>{const ring=g.querySelector('.ring');const ph=(T*1.2+i*.5)%1;ring.setAttribute('r',20+ph*40);ring.setAttribute('opacity',(1-ph)*.9);});
  s.chip.style.opacity=P(T,s.t+.6,.5);s.chip.style.transform=`translateY(${(1-P(T,s.t+.6,.5))*14}px)`;
  // caméra de la carte
  const c=s.fx.route==='abyssinie'?[pj(39.3,17.6),1.08,1.2]:[pj(39.7,23.0),1.55,1.8];
  const q=eio(cl((T-s.t)/(s.end+XF-s.t)));const z=lerp(c[1],c[2],q);const cy=s.fx.route==='abyssinie'?390:450;
  s.g.setAttribute('transform',`translate(${960-c[0][0]*z},${cy-c[0][1]*z}) scale(${z})`);}

/* ================= CARTE : UHUD ================= */
function blob(cx,cy,rx,ry,seed,n=28){let d='';for(let i=0;i<=n;i++){const a=i/n*6.283;const r=1+.18*Math.sin(a*3+seed)+.1*Math.sin(a*5+seed*2)+.06*Math.sin(a*9+seed*3);
  const x=cx+Math.cos(a)*rx*r,y=cy+Math.sin(a)*ry*r;d+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1);}return d+'Z';}
const MUS=[[860,560],[960,560],[1060,560],[1160,560],[900,610],[1000,610],[1100,610]];
const QUR=[[620,930],[740,940],[860,950],[980,955],[1100,950],[1220,940],[1340,930],[1460,915],[680,1000],[800,1010],[920,1015],[1040,1015],[1160,1010],[1280,1000],[1400,990]];
function mapUhud(s){let rings='';for(let k=0;k<7;k++){rings+=`<path d="${blob(980,150,760-k*85,190-k*20,1.3+k*.4)}" fill="${['#123b2f','#16453a','#1b5044','#205a4d','#276656','#2e705e','#367a67'][k]}" stroke="rgba(237,203,133,${.18+k*.05})" stroke-width="2"/>`;}
  let hill='';for(let k=0;k<4;k++){hill+=`<path d="${blob(640,640,150-k*32,70-k*14,4.1+k)}" fill="${['#16453a','#1d5245','#256050','#2d6c5b'][k]}" stroke="rgba(237,203,133,${.2+k*.08})" stroke-width="2"/>`;}
  let topo='';for(let k=0;k<9;k++){topo+=`<path d="${blob(960,560,1100+k*120,380+k*60,.7+k*.3,40)}" fill="none" stroke="rgba(237,203,133,.05)" stroke-width="2"/>`;}
  const mus=MUS.map((p,i)=>`<rect class="mu" x="${p[0]-40}" y="${p[1]-16}" width="80" height="32" rx="5" fill="#1f8a66" stroke="#FBF6EA" stroke-width="2.5" opacity="0"/>`).join('');
  const qur=QUR.map((p,i)=>`<rect class="qu" x="${p[0]-44}" y="${p[1]-16}" width="88" height="32" rx="5" fill="#8a5a2b" stroke="#FBF6EA" stroke-width="2.5" opacity="0"/>`).join('');
  let arch='';for(let i=0;i<9;i++){arch+=`<circle class="ar1" cx="${570+i*17}" cy="${630+Math.sin(i)*8}" r="6" fill="#FBF6EA" opacity="0"/>`;}
  let sp='';for(let i=0;i<60;i++){sp+=`<circle class="spk" r="3" fill="#FFE3A8" opacity="0"/>`;}
  return `<div class="ov" style="background:radial-gradient(ellipse at 50% 55%,#0e3e31 0%,#0a2e24 55%,#051a14 100%)"></div>
  <svg width="1920" height="1080" style="position:absolute;left:0;top:0;overflow:visible"><g class="ucam">

   <text class="lb lM" x="980" y="130" text-anchor="middle" font-size="34" fill="#FBF6EA" opacity="0" style="letter-spacing:.55em">MONT UHUD</text>

   <g class="med" opacity="0"><path d="M1640 900 L1640 1010" stroke="#EDCB85" stroke-width="4"/><path d="M1622 990 L1640 1020 L1658 990" fill="none" stroke="#EDCB85" stroke-width="4"/><text x="1640" y="880" text-anchor="middle" font-size="22" fill="#EDCB85">MÉDINE</text></g>
   ${mus}
   <text class="lb lMu" x="1010" y="680" text-anchor="middle" font-size="22" fill="#FBF6EA" opacity="0">MUSULMANS · ≈ 700</text>
   <g class="qwrap">${qur}</g>
   <text class="lb lQ" x="1040" y="1068" text-anchor="middle" font-size="22" fill="#F0C9A0" opacity="0">QURAYSH · ≈ 3 000</text>
   <g class="spks">${sp}</g>
   <g class="flag" opacity="0"><g class="flagr"><rect x="-4" y="-150" width="8" height="150" fill="#EDCB85"/><path class="cloth" d="M4 -148 L110 -140 L104 -96 L4 -100 Z" fill="#141414" stroke="#EDCB85" stroke-width="3"/></g>
     <circle class="fglow" r="60" fill="rgba(255,226,160,.0)"/></g>
   <g class="flabel" opacity="0"><line x1="1010" y1="360" x2="1010" y2="395" stroke="#EDCB85" stroke-width="2"/><text x="1010" y="345" text-anchor="middle" font-size="22" fill="#EDCB85">L'ÉTENDARD · MUS'AB</text></g>
  </g></svg>
  <div class="ov" style="background:linear-gradient(to bottom,rgba(0,0,0,0) 62%,rgba(3,12,9,.85) 100%)"></div><div class="ov udark" style="background:#050806;opacity:0"></div>
  <div class="chip uchip" style="left:70px;top:140px;opacity:0;background:rgba(20,20,20,.85)">AN 3 DE L'HÉGIRE · 625</div>`;}
function renderUhud(s,T){const el=s.el,f=s.fx;
  if(!s.mu){s.mu=[...el.querySelectorAll('.mu')];s.qu=[...el.querySelectorAll('.qu')];s.ar=[...el.querySelectorAll('.ar1')];s.spk=[...el.querySelectorAll('.spk')];
    s.flag=el.querySelector('.flag');s.flagr=el.querySelector('.flagr');s.cloth=el.querySelector('.cloth');s.fglow=el.querySelector('.fglow');s.g=el.querySelector('.ucam');s.dark=el.querySelector('.udark');}
  const t0=s.t;
  // caméra : léger travelling avant vers l'étendard
  const q=eio(cl((T-t0)/(f.end+XF-t0)));const z=lerp(1.0,1.22,q)+(T>f.fall?.05*P(T,f.fall,1.2):0);const fx=1010,fy=lerp(520,500,q);
  s.g.setAttribute('transform',`translate(${960-fx*z},${lerp(540,560,q)-fy*z}) scale(${z})`);
  el.querySelector('.mount').setAttribute('opacity',P(T,t0,.8));el.querySelector('.hill').setAttribute('opacity',P(T,t0+.3,.8));el.querySelector('.topo').setAttribute('opacity',P(T,t0,1.2));
  el.querySelector('.lM').setAttribute('opacity',P(T,t0+.5,.5));el.querySelector('.lH').setAttribute('opacity',P(T,t0+1.0,.5));el.querySelector('.med').setAttribute('opacity',P(T,t0+1.2,.5));
  if(T>t0+.5)mark('uM','tick',t0+.5);if(T>t0+1.0)mark('uH','tick',t0+1.0);
  s.mu.forEach((r,i)=>{const a=P(T,t0+.7+i*.07,.35,bk);r.setAttribute('opacity',cl(a));r.setAttribute('transform',`translate(0,${(1-cl(a))*-20})`);});
  if(T>t0+.7)mark('uMu','units',t0+.7);
  el.querySelector('.lMu').setAttribute('opacity',P(T,t0+1.3,.5)*(1-P(T,f.adv+.6,.4)));
  s.ar.forEach((c,i)=>c.setAttribute('opacity',P(T,t0+1.1+i*.04,.2)));
  el.querySelector('.uchip').style.opacity=P(T,f.date-.1,.5);
  // Quraysh arrive puis avance
  const qa=P(T,f.date+.6,.6), adv=eio(cl((T-f.adv)/2.4));
  if(T>f.date+.6)mark('uQ','units',f.date+.6);if(T>f.adv)mark('uAdv','advance',f.adv);
  s.qu.forEach((r,i)=>{const [x,y]=QUR[i];const ty=-adv*(y>980?300:320);const sx=(x-1040)*-.18*adv;r.setAttribute('opacity',qa);r.setAttribute('transform',`translate(${sx},${ty+(1-qa)*40})`);});
  el.querySelector('.lQ').setAttribute('opacity',qa*(1-adv));
  // étendard
  const fa=P(T,f.flag,.5,bk);s.flag.setAttribute('opacity',cl(fa*3));if(T>f.flag)mark('uF','flag',f.flag);
  const fall=eo3(cl((T-f.fall)/.9)); if(T>f.fall)mark('uFall','fall',f.fall);
  const wave=Math.sin(T*6)*6*(1-fall);
  s.cloth.setAttribute('d',`M4 -148 Q57 ${-150+wave} 110 -140 L104 -96 Q55 ${-94-wave} 4 -100 Z`);
  s.flag.setAttribute('transform',`translate(1010,${545+fall*30}) scale(${lerp(.4,1,cl(fa))})`);
  s.flagr.setAttribute('transform',`rotate(${fall*84})`);
  const hold=T>f.hold&&T<f.fall?.35+.25*Math.sin((T-f.hold)*8):(T>=f.adv&&T<f.fall?.18:0);
  s.fglow.setAttribute('fill',`rgba(255,226,160,${hold})`);s.fglow.setAttribute('cy',-90);
  el.querySelector('.flabel').setAttribute('opacity',P(T,f.flag+.3,.4)*(1-P(T,f.fall,.4)));
  // étincelles du combat
  const on=T>f.adv+1.7;
  s.spk.forEach((c,i)=>{if(!on){c.setAttribute('opacity',0);return;}const life=.55,ph=((T-(f.adv+1.7))*1.6+rnd(i))%1;const x0=780+rnd(i+7)*460,y0=600+rnd(i+13)*30;
    const ang=rnd(i+3)*6.283;c.setAttribute('cx',x0+Math.cos(ang)*ph*50);c.setAttribute('cy',y0+Math.sin(ang)*ph*30-ph*20);
    c.setAttribute('opacity',(1-ph)*(T>f.fall+1.2?cl(1-(T-f.fall-1.2)):1)*.9);});
  if(T>f.adv+1.7)mark('uClash','clash',f.adv+1.7);
  // assombrissement après la chute
  s.dark.style.opacity=.55*P(T,f.fall+.4,1.4);
  el.querySelector('svg').style.filter=`saturate(${1-.7*P(T,f.fall+.3,1.2)})`;}

/* ================= FIN : SOURCES & ABONNE-TOI ================= */
function endCard(){return `<img class="ph" src="hd/M26_golden_rays.jpg" style="filter:blur(10px) brightness(.45);transform:translate(-700px,0) scale(1.05)">
 <div class="ov" style="background:radial-gradient(ellipse 90% 60% at 50% 45%,rgba(15,91,70,.82) 0%,rgba(5,30,22,.96) 100%)"></div>
 <div class="e1 ar" style="position:absolute;left:0;right:0;top:560px;text-align:center;font-size:84px;line-height:1.5;color:var(--gold);text-shadow:0 6px 30px rgba(0,0,0,.6)">مُصْعَبُ بْنُ عُمَيْرٍ<br>رَضِيَ اللهُ عَنْهُ</div>
 <div class="e2" style="position:absolute;left:390px;width:300px;top:860px;height:2px;background:rgba(237,203,133,.7)"></div>
 <div class="e3" style="position:absolute;left:0;right:0;top:905px;text-align:center;font-family:Inter;font-weight:800;font-size:26px;letter-spacing:.45em;color:var(--gold)">SOURCE</div>
 <div class="e4 corm" style="position:absolute;left:60px;right:60px;top:965px;text-align:center;font-size:58px;line-height:1.3;color:var(--cream)">__SRC__</div>

function subCard(){return `<div class="sD" style="position:absolute;left:260px;top:500px;width:560px;height:560px;border-radius:50%;background:var(--acc)"></div>
 <img class="sL" src="img/logo.png" style="position:absolute;left:350px;top:590px;width:380px">
 <div class="sT anton" style="position:absolute;left:0;right:0;top:1150px;text-align:center;font-size:170px;color:var(--ink);line-height:1">ABONNE-TOI</div>
 <div class="sS" style="position:absolute;left:0;right:0;top:1340px;text-align:center;font-family:Inter;font-weight:600;font-size:30px;letter-spacing:.3em;color:var(--ink)">UNE HISTOIRE CHAQUE VENDREDI</div>
 <div class="sB" style="position:absolute;left:340px;top:1440px;width:400px;text-align:center;font-family:Inter;font-weight:800;font-size:34px;color:#F4F1EA;background:var(--acc);padding:28px 0;border-radius:80px;letter-spacing:.2em">S'ABONNER</div>`;}
function renderEnd(s,T){const e=s.el,q=c=>e.querySelector(c);const h=T-s.t;
  const w=P(h,.2,1.2,eio);q('.e1').style.clipPath=`inset(0 0 0 ${100-w*100}%)`;if(h>.2)mark('e1','arabic',s.t+.2);
  q('.e2').style.transform=`scaleX(${P(h,1.1,.6)})`;q('.e3').style.opacity=P(h,1.3,.5);
  const f=P(h,1.5,.7,eo5);q('.e4').style.opacity=f;q('.e4').style.transform=`translateY(${(1-f)*24}px)`;q('.e5').style.opacity=P(h,2.0,.6);
  }
function renderSub(s,T){const e=s.el,q=c=>e.querySelector(c);const h=T-s.t;
  q('.sD').style.transform=`scale(${P(h,.05,.6,bk)})`;q('.sL').style.transform=`scale(${P(h,.2,.6,bk)})`;
  const tp=P(h,.35,.4,ex);if(h>.35)mark('sT','slamH',s.t+.35);q('.sT').style.transform=`scale(${lerp(1.5,1,tp)})`;q('.sT').style.opacity=h>.35?1:0;
  q('.sS').style.opacity=P(h,.7,.5);const b=P(h,1.0,.5,bk);if(h>1.0)mark('sB','pop',s.t+1.0);
  q('.sB').style.transform=`scale(${b*(1+(h>1.9&&h<2.1?.06:0))})`;}

/* ================= SOUS-TITRES ================= */
const CAPS=$('caps');
D.chunks.forEach((c,ci)=>{const d=document.createElement('div');const q=c.quote&&!c.band;
  d.className='blk '+(q?'corm sh':'anton sh');d.style.bottom=(c.band?560:560)+'px';c.el=d;c.words=[];
  c.lines.forEach((L,li)=>{const ln=document.createElement('div');ln.className='ln'+(c.band?' band':'');
    ln.style.fontSize=(c.band?(c.lines.length>1?104:122):(q?86:92))+'px';
    L.forEach(([tx,s,e,k],wi)=>{const sp=document.createElement('span');sp.className='w'+(k?' k':'');sp.textContent=tx;ln.appendChild(sp);if(wi<L.length-1)ln.appendChild(document.createTextNode(' '));
      c.words.push({el:sp,t0:s,k,key:`${ci}-${li}-${wi}`});});
    d.appendChild(ln);});
  CAPS.appendChild(d);});
function fitCaps(){D.chunks.forEach(c=>c.el.querySelectorAll('.ln').forEach(l=>{c.el.style.display='flex';let fs=parseFloat(l.style.fontSize);while(l.scrollWidth>960&&fs>34){fs-=2;l.style.fontSize=fs+'px';}c.el.style.display='none';}));}
function capsHidden(T){const t=D.title;if(T>t.t0-.05&&T<t.t1+.2)return true;if(D.chap.some(c=>T>=c[0]+.15&&T<c[1]+.1))return true;return false;}
function renderCaps(T){const hid=capsHidden(T);
  D.chunks.forEach((c,ci)=>{const vis=!hid&&T>=c.t0-.1&&T<c.hide+.1;c.el.style.display=vis?'flex':'none';if(!vis)return;
    const out=cl((T-c.hide)/.1);c.el.style.opacity=1-out;c.el.style.transform=`translateY(${-out*14}px)`;
    if(c.band){mark('band'+ci,'band',c.t0);c.el.querySelectorAll('.ln').forEach((l,li)=>{const p=eo5(cl((T-(c.t0-.16+li*.18))/.32));l.style.clipPath=`inset(-30% ${100-p*100}% -30% 0)`;});}
    c.words.forEach(w=>{const slam=c.band&&w.k;const p=cl((T-(w.t0-.06))/(slam?.45:.3));const e=eo5(p);
      if(p>0)mark(w.key,slam?'slam':(w.k?'key':'word'),w.t0);
      if(slam){w.el.style.transform=`scale(${lerp(1.9,1,ex(p))})`;w.el.style.opacity=cl(p/.1);const g=T-w.t0;w.el.style.filter=g>0&&g<.3?`drop-shadow(0 0 ${34*(1-g/.3)}px rgba(237,203,133,.95))`:'none';}
      else{w.el.style.opacity=e;w.el.style.transform=`translateY(${(1-e)*.36}em) scale(${w.k?lerp(1.14,1,e):1})`;w.el.style.filter=p<1?`blur(${(1-e)*9}px)`:'none';}});});}

/* ================= TITRE & CHAPITRES ================= */
function renderTitle(T){const t=D.title,el=$('title');const on=T>t.t0-.05&&T<t.t1+.4;el.style.display=on?'block':'none';if(!on)return;
  el.style.opacity=cl((t.t1+.4-T)/.4);
  const h=P(T,t.th-.05,.5,eo5);$('tH').style.opacity=h;$('tH').style.letterSpacing=lerp(1.1,.55,h)+'em';if(T>t.th)mark('tH','titleH',t.th);
  const n=cl((T-(t.tn-.08))/.5);$('tN').style.opacity=n>0?1:0;$('tN').style.transform=`scale(${lerp(1.7,1,ex(n))})`;
  const g=T-t.tn;$('tN').style.filter=g>0&&g<.5?`drop-shadow(0 0 ${50*(1-g/.5)}px rgba(237,203,133,.95))`:'none';if(T>t.tn-.08)mark('tN','titleN',t.tn);
  $('tRule').style.transform=`scaleX(${P(T,t.tn+.35,.6,eio)})`;
  const a=P(T,t.tn+.55,1.0,eio);$('tAr').style.clipPath=`inset(0 0 0 ${100-a*100}%)`;$('tAr').style.opacity=a>0?1:0;}
function renderChap(T){const C=D.chap.find(c=>T>=c[0]-.02&&T<c[1]+.35);const el=$('chap');el.style.display=C?'block':'none';if(!C)return;
  const [a,b,num,tt]=C;mark('chap'+num,'chap',a);
  const i=eo3(cl((T-a)/.4)),o=cl((b+.35-T)/.35);el.style.opacity=Math.min(i,o);
  $('chapNum').textContent='CHAPITRE '+num;$('chapT').textContent=tt;
  const w=eo5(cl((T-a-.12)/.55));$('chapT').style.clipPath=`inset(-20% ${50-w*50}% -20% ${50-w*50}%)`;$('chapT').style.transform=`scale(${lerp(1.08,1,w)})`;
  $('chapT').style.letterSpacing=lerp(14,3,w)+'px';
  $('chapNum').style.opacity=P(T,a+.05,.4);$('chapRule').style.transform=`scaleX(${P(T,a+.3,.6,eio)})`;}

/* ================= POUSSIÈRE ================= */
const cv=$('dust'),cx=cv.getContext('2d');
const MOTES=[...Array(120)].map((_,i)=>({x:rnd(i)*1080,y:rnd(i+500)*1920,r:1+rnd(i+900)*3,sp:5+rnd(i+77)*14,ph:rnd(i+33)*6.28,big:rnd(i+5)>.93}));
function renderDust(T,op){cx.clearRect(0,0,1080,1920);if(op<=0.01)return;
  MOTES.forEach(m=>{const x=(m.x+T*m.sp*1.1+Math.sin(T*.5+m.ph)*26)%1120-20,y=(m.y-T*m.sp*.5+1960)%1960-20;
    const beam=Math.exp(-Math.pow(((x-540)+(y-900)*0.6)/380,2));const al=op*(0.10+0.5*beam)*(0.6+0.4*Math.sin(T*1.7+m.ph));const r=m.big?m.r*3.2:m.r;
    const g=cx.createRadialGradient(x,y,0,x,y,r*2.2);g.addColorStop(0,`rgba(255,236,190,${al})`);g.addColorStop(1,'rgba(255,236,190,0)');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r*2.2,0,6.283);cx.fill();});}

/* ================= RENDU ================= */
function render(T){let dust=0;
  SH.forEach((s,i)=>{const op=layerOp(s,T);s.el.style.display=op>0?'block':'none';s.el.style.opacity=op;s.el.style.zIndex=i;if(op<=0)return;
    if(i>0&&T>=s.t)mark('shot'+i,s.img.startsWith('MAP')?'mapin':(s.img==='END'||s.img==='SUB'?'endin':'shot'),s.t);
    if(/^M\d/.test(s.img)){renderPhoto(s,T);dust=Math.max(dust,(s.fx.dust||0)*op);}
    else if(s.img==='MAP_RS')renderMapRS(s,T);else if(s.img==='MAP_UHUD')renderUhud(s,T);else if(s.img==='END')renderEnd(s,T);else if(s.img==='SUB')renderSub(s,T);});
  renderDust(T,dust*(capsHidden(T)?.6:1));renderTitle(T);renderCaps(T);renderChap(T);
  const endMode=T>D.VEND+.5;$('tag').style.opacity=endMode?0:1;$('logo').style.opacity=endMode?0:.9;
  const f=Math.floor(T*30);$('grain').style.transform=`translate(${(f*137)%200-100}px,${(f*271)%200-100}px)`;
  $('fade').style.opacity=Math.max(1-cl(T/.4),cl((T-(DUR-.5))/.5));}
window.render=render;window.EV=EV;window.DUR=DUR;
window.READY=false;document.fonts.ready.then(()=>{initLayers();fitCaps();render(0);window.READY=true;});
